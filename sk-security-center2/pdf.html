<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Viewer Child</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #525659;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      color: #f1f1f1;
    }
    .toolbar {
      height: 48px;
      background-color: #323639;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      z-index: 10;
      user-select: none;
    }
    .toolbar-section { display: flex; align-items: center; gap: 8px; }
    .doc-title {
      font-size: 13px; font-weight: 500; color: #e8eaed;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px;
    }
    .btn {
      background: transparent; border: none; color: #e8eaed; height: 32px;
      border-radius: 4px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 13px; padding: 0 8px;
      transition: background-color 0.15s ease;
    }
    .btn:hover { background-color: rgba(255, 255, 255, 0.12); }
    .btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .btn.active { background-color: #8ab4f8; color: #202124; font-weight: 600; }
    .page-control { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #bdc1c6; }
    .page-input {
      width: 44px; height: 26px; background-color: #202124; border: 1px solid #5f6368;
      border-radius: 4px; color: #ffffff; text-align: center; font-size: 13px; outline: none;
    }
    .divider { width: 1px; height: 20px; background-color: #5f6368; margin: 0 6px; }
    .viewer-container {
      flex: 1; overflow: auto; display: flex; justify-content: center; align-items: center; padding: 16px;
    }
    #pdf-canvas { background-color: #ffffff; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45); display: block; margin: auto; }
  </style>
</head>
<body>

  <div class="toolbar">
    <div class="toolbar-section">
      <span class="doc-title" id="doc-title">문서 로딩 중...</span>
    </div>

    <div class="toolbar-section">
      <button class="btn" id="prev-btn" title="이전" style="width: 32px;" disabled>◀</button>
      <div class="page-control">
        <input type="number" id="page-num-input" class="page-input" value="1" min="1">
        <span>/</span>
        <span id="page-count-display">0</span>
      </div>
      <button class="btn" id="next-btn" title="다음" style="width: 32px;" disabled>▶</button>
    </div>

    <div class="toolbar-section">
      <button class="btn" id="zoom-out-btn" style="width: 32px;">-</button>
      <span id="zoom-text" style="font-size: 13px; width: 48px; text-align: center;">100%</span>
      <button class="btn" id="zoom-in-btn" style="width: 32px;">+</button>
      <div class="divider"></div>
      <button class="btn" id="fit-width-btn">너비 맞춤</button>
      <button class="btn active" id="fit-page-btn">페이지 맞춤</button>
    </div>
  </div>

  <div class="viewer-container" id="viewer-container">
    <canvas id="pdf-canvas"></canvas>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let pdfDoc = null;
    let pageNum = 1;
    let pageRendering = false;
    let pageNumPending = null;
    let scale = 1.0;
    let fitMode = 'page'; // 기본: 페이지 맞춤

    const canvas = document.getElementById('pdf-canvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('viewer-container');

    // 🔗 부모로 상태 전송 함수
    function notifyParent() {
      if (window.parent && pdfDoc) {
        window.parent.postMessage({
          type: 'PDF_PAGE_CHANGED',
          currentPage: pageNum,
          totalPages: pdfDoc.numPages
        }, '*');
      }
    }

    // 🔗 URL 파라미터(?file=경로) 감지
    function getPdfUrlFromQuery() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('file') || 'your-wide-document.pdf';
    }

    function updateFitButtonsUI() {
      document.getElementById('fit-width-btn').classList.toggle('active', fitMode === 'width');
      document.getElementById('fit-page-btn').classList.toggle('active', fitMode === 'page');
    }

    function renderPage(num) {
      pageRendering = true;

      pdfDoc.getPage(num).then(page => {
        const unscaledViewport = page.getViewport({ scale: 1.0 });

        if (fitMode === 'width') {
          const availableWidth = container.clientWidth - 32;
          if (availableWidth > 0) scale = availableWidth / unscaledViewport.width;
        } else if (fitMode === 'page') {
          const availableWidth = container.clientWidth - 32;
          const availableHeight = container.clientHeight - 32;
          if (availableWidth > 0 && availableHeight > 0) {
            scale = Math.min(availableWidth / unscaledViewport.width, availableHeight / unscaledViewport.height);
          }
        }

        const viewport = page.getViewport({ scale: scale });
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        document.getElementById('zoom-text').innerText = `${Math.round(scale * 100)}%`;

        const renderTask = page.render({ canvasContext: ctx, viewport: viewport });

        renderTask.promise.then(() => {
          pageRendering = false;
          notifyParent(); // ⭐️ 렌더링 완료 시 부모에게 페이지 번호 전송
          if (pageNumPending !== null) {
            renderPage(pageNumPending);
            pageNumPending = null;
          }
        });

        document.getElementById('page-num-input').value = num;
        document.getElementById('prev-btn').disabled = (pageNum <= 1);
        document.getElementById('next-btn').disabled = (pageNum >= pdfDoc.numPages);
        updateFitButtonsUI();
      });
    }

    function queueRenderPage(num) {
      if (pageRendering) pageNumPending = num;
      else renderPage(num);
    }

    function goToPrevPage() {
      if (pageNum <= 1) return;
      pageNum--;
      queueRenderPage(pageNum);
    }

    function goToNextPage() {
      if (!pdfDoc || pageNum >= pdfDoc.numPages) return;
      pageNum++;
      queueRenderPage(pageNum);
    }

    function loadPDF(source) {
      pdfjsLib.getDocument(source).promise.then(pdf => {
        pdfDoc = pdf;
        document.getElementById('page-count-display').innerText = pdf.numPages;
        document.getElementById('page-num-input').max = pdf.numPages;
        pageNum = 1;
        fitMode = 'page';
        queueRenderPage(pageNum);
      }).catch(err => {
        console.error('PDF 로딩 실패:', err);
        document.getElementById('doc-title').innerText = 'PDF 로딩 실패';
      });
    }

    window.addEventListener('message', (event) => {
      if (!event.data || !event.data.type) return;

      if (event.data.type === 'PREV_PAGE') {
        goToPrevPage();
      } else if (event.data.type === 'NEXT_PAGE') {
        goToNextPage();
      }
    });

    // 내부 이벤트 처리
    document.getElementById('prev-btn').addEventListener('click', goToPrevPage);
    document.getElementById('next-btn').addEventListener('click', goToNextPage);
    document.getElementById('fit-width-btn').addEventListener('click', () => { fitMode = 'width'; queueRenderPage(pageNum); });
    document.getElementById('fit-page-btn').addEventListener('click', () => { fitMode = 'page'; queueRenderPage(pageNum); });

    // 초기 실행
    const targetPdfUrl = getPdfUrlFromQuery();
    document.getElementById('doc-title').innerText = targetPdfUrl.split('/').pop();
    loadPDF(targetPdfUrl);
  </script>
</body>
</html>
